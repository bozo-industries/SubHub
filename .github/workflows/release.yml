name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable release tag to build"
        required: true
        type: string
      build_ref:
        description: "Optional branch or commit to sign instead of the release tag"
        required: false
        type: string
      publish_release:
        description: "Publish signed assets as a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.build_ref || inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      BUILD_REF: ${{ inputs.build_ref || inputs.release_tag || github.ref_name }}
      PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BUILD_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag and version metadata
        id: version
        shell: bash
        run: |
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            python3 scripts/release_version.py \
              --tag "${RELEASE_TAG}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/release_version.py --github-output "${GITHUB_OUTPUT}"
          fi
      - name: Test release-note generation
        run: python3 -m unittest scripts.test_generate_release_notes
      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SUBHUB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/subhub-release.jks"
      - name: Test, lint, and build signed release APKs
        env:
          SUBHUB_SIGNING_STORE_FILE: ${{ runner.temp }}/subhub-release.jks
          SUBHUB_SIGNING_STORE_PASSWORD: ${{ secrets.SUBHUB_SIGNING_STORE_PASSWORD }}
          SUBHUB_SIGNING_KEY_ALIAS: ${{ secrets.SUBHUB_SIGNING_KEY_ALIAS }}
          SUBHUB_SIGNING_KEY_PASSWORD: ${{ secrets.SUBHUB_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SUBHUB_SIGNING_STORE_PASSWORD"
          test -n "$SUBHUB_SIGNING_KEY_ALIAS"
          test -n "$SUBHUB_SIGNING_KEY_PASSWORD"
          ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done
      - name: Stage versioned release artifacts
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          output="app/build/outputs/apk/release"
          universal="$output/app-universal-release.apk"
          test -f "$universal"
          mkdir -p dist
          cp "$universal" "dist/SubHub-${VERSION_NAME}-universal.apk"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="$output/app-${abi}-release.apk"
            test -f "$apk"
            cp "$apk" "dist/SubHub-${VERSION_NAME}-${abi}.apk"
          done
          sha256sum dist/*.apk > "dist/SubHub-${VERSION_NAME}-SHA256SUMS.txt"
      - name: Compose release changelog
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_notes.py \
            --tag "${RELEASE_TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --changelog-output dist/changelog.md \
            --release-output dist/release-notes.md
      - name: Compose updater manifest
        if: env.PUBLISH_RELEASE == 'true'
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION_NAME"]
          code = int(os.environ["VERSION_CODE"])
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          dist = Path("dist")
          assets = []
          for abi in ("universal", "armeabi-v7a", "arm64-v8a", "x86", "x86_64"):
              name = f"SubHub-{version}-{abi}.apk"
              path = dist / name
              data = path.read_bytes()
              assets.append({
                  "abi": abi,
                  "name": name,
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{name}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })
          manifest = {
              "schema": 1,
              "packageName": "com.subhub.app",
              "versionName": version,
              "versionCode": code,
              "minSdk": 26,
              "tag": tag,
              "releaseNotes": (dist / "changelog.md").read_text(encoding="utf-8"),
              "assets": assets,
          }
          output = dist / f"SubHub-{version}-update.json"
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Publish GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft' > release-draft.txt 2>/dev/null; then
            test "$(cat release-draft.txt)" = "true"
            gh release edit "${RELEASE_TAG}" \
              --notes-file dist/release-notes.md \
              --title "SubHub ${VERSION_NAME}"
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --notes-file dist/release-notes.md \
              --title "SubHub ${VERSION_NAME}"
          fi

          for asset in \
            dist/*.apk \
            dist/*-update.json \
            dist/*-SHA256SUMS.txt; do
            gh release upload "${RELEASE_TAG}" "$asset" --clobber
          done

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = {
              path.name: path.stat().st_size
              for path in Path("dist").iterdir()
              if path.suffix == ".apk"
              or path.name.endswith("-update.json")
              or path.name.endswith("-SHA256SUMS.txt")
          }
          release = json.loads(subprocess.check_output([
              "gh", "release", "view", os.environ["RELEASE_TAG"],
              "--json", "assets",
          ], text=True))
          actual = {asset["name"]: asset["size"] for asset in release["assets"]}
          if actual != expected:
              raise SystemExit(f"Release asset mismatch: expected {expected}, got {actual}")
          PY

          gh release edit "${RELEASE_TAG}" --draft=false

      - name: Upload private signed-build artifact
        if: github.event_name == 'workflow_dispatch' && env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SubHub-${{ steps.version.outputs.version_name }}-signed-${{ github.run_id }}
          path: |
            dist/*.apk
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
