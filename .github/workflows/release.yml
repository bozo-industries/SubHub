name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag and version metadata
        id: version
        run: python3 scripts/release_version.py --tag "${GITHUB_REF_NAME}" --github-output "${GITHUB_OUTPUT}"
      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SUBHUB_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/subhub-release.jks"
      - name: Test, lint, and build signed release APKs
        env:
          SUBHUB_SIGNING_STORE_FILE: ${{ runner.temp }}/subhub-release.jks
          SUBHUB_SIGNING_STORE_PASSWORD: ${{ secrets.SUBHUB_SIGNING_STORE_PASSWORD }}
          SUBHUB_SIGNING_KEY_ALIAS: ${{ secrets.SUBHUB_SIGNING_KEY_ALIAS }}
          SUBHUB_SIGNING_KEY_PASSWORD: ${{ secrets.SUBHUB_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SUBHUB_SIGNING_STORE_PASSWORD"
          test -n "$SUBHUB_SIGNING_KEY_ALIAS"
          test -n "$SUBHUB_SIGNING_KEY_PASSWORD"
          ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --verbose "$apk"
          done
      - name: Stage versioned release artifacts
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          output="app/build/outputs/apk/release"
          universal="$output/app-universal-release.apk"
          test -f "$universal"
          mkdir -p dist
          cp "$universal" "dist/SubHub-${VERSION_NAME}-universal.apk"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="$output/app-${abi}-release.apk"
            test -f "$apk"
            cp "$apk" "dist/SubHub-${VERSION_NAME}-${abi}.apk"
          done
          sha256sum dist/*.apk > "dist/SubHub-${VERSION_NAME}-SHA256SUMS.txt"
      - name: Compose release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          generated="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body')"
          cat > dist/release-notes.md <<'EOF'
          ## Choose your APK

          - **Universal** works on every Android CPU architecture supported by SubHub. **Choose Universal if you are unsure.**
          - **arm64-v8a** is the smaller download for most modern Android phones and tablets.
          - **armeabi-v7a** is for older 32-bit ARM devices.
          - **x86** and **x86_64** are primarily for compatible Intel devices and Android emulators.

          Per-ABI APKs are smaller, but only install on their matching architecture. All APKs in this release contain the same SubHub version and features.

          ## Changes

          EOF
          printf '%s\n' "$generated" >> dist/release-notes.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.apk \
            dist/*-SHA256SUMS.txt \
            --verify-tag \
            --notes-file dist/release-notes.md \
            --title "SubHub ${VERSION_NAME}"
