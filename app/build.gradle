plugins {
    id 'com.android.application'
}

def configuredPayPalBackend = providers.gradleProperty('paypalBackendUrl')
        .orElse(providers.environmentVariable('SUBHUB_PAYPAL_BACKEND_URL'))
        .getOrElse('')
        .trim()
def asBuildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'com.betasafe.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.betasafe.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-reconstruction'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'PAYPAL_BACKEND_URL',
                    asBuildConfigString(configuredPayPalBackend)
        }
        release {
            buildConfigField 'String', 'PAYPAL_BACKEND_URL',
                    asBuildConfigString(configuredPayPalBackend)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }

    lint {
        // The restored selector intentionally localizes the navigation/help shell first;
        // untranslated feature detail is expected to fall back to reviewed English copy.
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
